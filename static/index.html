<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DarGlobal & Wasalt Assistant</title>
<style>
  :root { --bg:#0f1420; --panel:#171e2e; --me:#2b5cff; --bot:#1f2840; --text:#e8ecf5; --muted:#8c97b2; --accent:#c9a45c; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f4f5f8; --panel:#fff; --me:#2b5cff; --bot:#eceff6; --text:#151a28; --muted:#667089; --accent:#9a7625; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text);
         display:flex; flex-direction:column; height:100vh; height:100dvh; }
  header { padding:14px 18px; background:var(--panel); border-bottom:1px solid #0002; }
  header h1 { margin:0; font-size:17px; } header h1 span { color:var(--accent); }
  header p { margin:2px 0 0; color:var(--muted); font-size:13px; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; max-width:860px; width:100%; margin:0 auto; }
  .msg { max-width:88%; padding:10px 14px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--me); color:#fff; border-bottom-right-radius:4px; }
  .bot { align-self:flex-start; background:var(--bot); border-bottom-left-radius:4px; }
  .src { margin-top:8px; font-size:12px; color:var(--muted); }
  .src a { color:var(--accent); text-decoration:none; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tag { font-size:11px; color:var(--muted); margin-top:6px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; max-width:860px; width:100%; margin:0 auto; padding:0 16px; }
  .chips button { background:var(--panel); color:var(--text); border:1px solid #8883; border-radius:999px; padding:6px 12px; cursor:pointer; font-size:13px; }
  form { display:flex; gap:8px; padding:12px 16px 16px; max-width:860px; width:100%; margin:0 auto; }
  input { flex:1; padding:12px 14px; border-radius:12px; border:1px solid #8884; background:var(--panel); color:var(--text); font-size:15px; }
  form button { padding:0 20px; border:0; border-radius:12px; background:var(--me); color:#fff; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
</style>
</head>
<body>
<header>
  <h1><span>DarGlobal</span> &amp; <span>Wasalt</span> Assistant</h1>
  <p>Ask about projects, services, markets and history. Answers come from collected public data.</p>
</header>
<div id="log"></div>
<div class="chips" id="chips"></div>
<form id="f">
  <input id="q" autocomplete="off" placeholder="e.g. What is Wasalt Matchmaker?" maxlength="2000">
  <button id="go">Send</button>
</form>
<script>
const log = document.getElementById('log'), q = document.getElementById('q'), go = document.getElementById('go');
const history = [];
const samples = ["Who founded DarGlobal and where is it listed?", "Which brands does DarGlobal partner with?",
  "What is Wasalt Matchmaker?", "How are DarGlobal and Wasalt related?", "What is Tierra Viva?"];

function add(role, text, extra) {
  const d = document.createElement('div'); d.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  d.textContent = text;
  if (extra && extra.sources && extra.sources.length) {
    const s = document.createElement('div'); s.className = 'src'; s.textContent = 'Sources';
    extra.sources.forEach(x => { const a = document.createElement('a'); a.href = x.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = x.title || x.url; s.appendChild(a); });
    d.appendChild(s);
  }
  if (extra && extra.mode) { const t = document.createElement('div'); t.className = 'tag';
    t.textContent = extra.mode === 'llm' ? ('model: ' + (extra.model || 'OpenRouter free')) : 'retrieval-only mode'; d.appendChild(t); }
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
async function ask(text) {
  if (!text.trim()) return;
  add('user', text); q.value = ''; go.disabled = true;
  const wait = add('bot', 'Thinking…');
  try {
    const r = await fetch('/api/chat', { method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ message: text, history: history.slice(-6) }) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json(); wait.remove(); add('bot', j.answer, j);
    history.push({role:'user', content:text}, {role:'assistant', content:j.answer});
  } catch (e) { wait.textContent = 'Something went wrong: ' + e.message; }
  go.disabled = false; q.focus();
}
document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); ask(q.value); });
const chips = document.getElementById('chips');
samples.forEach(s => { const b = document.createElement('button'); b.type = 'button'; b.textContent = s; b.onclick = () => ask(s); chips.appendChild(b); });
add('bot', "Hi! I can answer questions about DarGlobal (luxury real-estate developer) and Wasalt (Saudi AI real-estate platform). What would you like to know?");
</script>
</body>
</html>
